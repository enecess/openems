services:
  openems-edge:
    image: enecess/openems-edge:dev-ecomain-20261009-47c814933
    pull_policy: never
    container_name: openems_edge
    hostname: openems-edge
    restart: unless-stopped
    volumes:
      - openems-edge-conf:/var/opt/openems/config:rw
      - openems-edge-data:/var/opt/openems/data:rw
    ports:
      - 8080:8080
      - 8085:8085
  openems-ui:
    image: enecess/openems-ui-edge:dev-ecomain-20261009-47c814933
    pull_policy: never
    container_name: openems_ui
    hostname: openems-ui
    restart: unless-stopped
    volumes:
      - openems-ui-conf:/etc/nginx:rw
      - openems-ui-log:/var/log/nginx:rw
    environment:
      WEBSOCKET_HOST: openems-edge
      WEBSOCKET_PORT: 8085
    ports:
      - 80:80
      - 443:443
volumes:
  openems-edge-conf:
  openems-edge-data:
  openems-ui-conf:
  openems-ui-log:
